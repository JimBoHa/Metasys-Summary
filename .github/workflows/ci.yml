name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on macOS
    runs-on: macos-latest
    # A cold macOS runner compiles bundled DuckDB twice (dashboard and legacy
    # helper); both test suites alone take about 20 minutes before Clippy and
    # the smoke build run. Keep a finite guard while allowing clean builds.
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      DUCKDB_DOWNLOAD_LIB: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust quality components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Run repository verification
        run: ./scripts/verify.sh
