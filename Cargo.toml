[package]
name = "metasys-dashboard"
version = "0.1.0"
edition = "2024"
description = "Native macOS Metasys alarm and equipment dashboard"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
duckdb = { version = "~1.10505.0", features = ["bundled"] }
futures-util = "0.3.33"
image = { version = "0.25.10", default-features = false, features = ["png"] }
keyring = "4.1.6"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-native-tls"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "native-tls"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tempfile = "3"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }
tiberius = { version = "0.12.3", default-features = false, features = ["chrono", "native-tls", "tds73"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
